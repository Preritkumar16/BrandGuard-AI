
services:
  postgres:
    image: postgres:16
    container_name: brandguard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: brandguard
      POSTGRES_USER: brandguard
      POSTGRES_PASSWORD: brandguard_dev_local_only
    ports:
      - "5432:5432"
    volumes:
      - brandguard_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandguard -d brandguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: brandguard-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - brandguard_qdrant_data:/qdrant/storage

volumes:
  brandguard_postgres_data:
  brandguard_qdrant_data:
